<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLosure</title>
</head>
<body style="background-color: black; color: aliceblue;">
    <button id="orange">Orange</button>
    <button id="green">Green</button>
    <script>
        function init(){
            let name="Mozilla";
            let lang="hindi"
            function displayName(){
         
            }
            displayName();//function inside function is lexical scoping
             console.log("inner",name); 
             console.log(lang);
             //lexical scope:
                    //to access  data  we have to function inside function
                    //  and in outer function the inner function call through 
                    // this the data inside outer function can be accessed 
                    // outside that function  i.e lexical scoping
        }
        
        console.log("outer",name)//not execute
        init();
        
    </script>
    <script>
        // document.getElementById('Orange').onclick=function(){
        //     document.body.style.backgroundColor='orange'
        // }
        // document.getElementById('Green').onclick=function(){
        //     document.body.style.backgroundColor='green'
        // }

        function clickhandler(color){
            // document.body.style.backgroundColor=`${color}`
           return function(){
                document.body.style.backgroundColor=`${color}`
            }
        }

        document.getElementById('orange').onclick=clickhandler("orange");
        document.getElementById('green').onclick=clickhandler("green");



    </script>
</body>
</html>
